<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 AI 工作站 - Prompt 提示詞庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f3fa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar for prompt preview cards */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-800">

    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-4">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🚀</span>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI 工作站</h1>
            </div>

            <!-- Top Navigation Tabs -->
            <div class="flex items-center bg-slate-200/70 p-1 rounded-xl text-sm font-medium text-slate-600">
                <button class="px-4 py-2 rounded-lg bg-indigo-600 text-white shadow-sm flex items-center space-x-2 transition">
                    <span>🎬</span>
                    <span>單項提示詞</span>
                </button>
                <button class="px-4 py-2 rounded-lg hover:text-slate-900 transition flex items-center space-x-2">
                    <span>⚡</span>
                    <span>流程提示詞</span>
                </button>
                <button class="px-4 py-2 rounded-lg hover:text-slate-900 transition flex items-center space-x-2">
                    <span>📁</span>
                    <span>工作流檔案</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-5">
        
        <!-- Search Input -->
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </div>
            <input type="text" id="searchInput" 
                placeholder="搜尋提示詞名稱、任務或內容關鍵字..." 
                class="w-full pl-11 pr-4 py-3.5 bg-white rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-700 shadow-sm transition placeholder-slate-400">
        </div>

        <!-- Filters Container -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
            <!-- Category Filter Row (主軸) -->
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <span class="w-16 font-medium text-slate-500 text-xs sm:text-sm">主軸</span>
                <div id="categoryFilters" class="flex flex-wrap gap-1.5 flex-1">
                    <!-- Dynamic Filter Pills -->
                </div>
            </div>

            <!-- Mode Filter Row (模式) -->
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <span class="w-16 font-medium text-slate-500 text-xs sm:text-sm">模式</span>
                <div id="modeFilters" class="flex flex-wrap gap-1.5 flex-1">
                    <!-- Dynamic Filter Pills -->
                </div>
            </div>

            <!-- AI Tool Filter Row (AI 工具) -->
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <span class="w-16 font-medium text-slate-500 text-xs sm:text-sm">AI 工具</span>
                <div id="toolFilters" class="flex flex-wrap gap-1.5 flex-1">
                    <!-- Dynamic Filter Pills -->
                </div>
            </div>
        </div>

        <!-- Status & Count Info -->
        <div class="flex items-center justify-between px-1 text-sm text-indigo-900 font-medium">
            <div id="itemCount">共 0 個提示詞</div>
            <div id="syncStatus" class="text-xs text-slate-500 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i>
                <span>讀取 Google Sheet 資料中...</span>
            </div>
        </div>

        <!-- Prompts Grid Container -->
        <div id="promptsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            <!-- Prompt Cards will be rendered dynamically -->
        </div>

    </main>

    <!-- Modal for Viewing & Editing Prompt -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <!-- Modal Header -->
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <div class="flex-1 pr-4">
                    <span id="modalSubcategory" class="text-xs text-indigo-600 font-semibold bg-indigo-50 px-2.5 py-0.5 rounded-full mb-1 inline-block">筆記整理</span>
                    <input type="text" id="modalTitleInput" class="w-full text-lg font-bold text-slate-800 bg-transparent border-b border-dashed border-slate-300 focus:border-indigo-500 focus:outline-none pb-0.5" placeholder="提示詞名稱">
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-200/50 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <!-- Modal Body (Editable Textarea) -->
            <div class="p-5 flex-1 flex flex-col overflow-hidden bg-slate-50/30">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-xs font-semibold text-slate-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                        <span>編輯 Prompt 內容</span>
                    </label>
                    <span class="text-xs text-slate-400">修改後可即時儲存或複製</span>
                </div>
                <textarea id="modalContentInput" 
                    class="w-full flex-1 p-4 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent font-mono text-sm leading-relaxed custom-scrollbar bg-white resize-none shadow-inner"
                    placeholder="輸入 Prompt 內容..."></textarea>
            </div>

            <!-- Modal Footer Actions -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between gap-3">
                <div class="text-xs text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-circle-info text-indigo-400"></i>
                    <span>支援即時編輯內容</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="modalSaveBtn" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold rounded-xl shadow-md transition flex items-center space-x-1.5 active:scale-95">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>儲存修改</span>
                    </button>
                    <button id="modalCopyBtn" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold rounded-xl shadow-md transition flex items-center space-x-1.5 active:scale-95">
                        <i class="fa-solid fa-copy"></i>
                        <span>複製修改後的 Prompt</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2 z-50">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toastMessage">Prompt 已成功複製到剪貼簿！</span>
    </div>

    <script>
        // Fallback Data matched with screenshot
        const fallbackPrompts = [
            {
                id: "049",
                title: "049-線上課程",
                subcategory: "筆記整理",
                category: "筆記",
                mode: "AI 助理",
                tools: ["ChatGPT", "Gemini AI"],
                content: `【角色設定】\n你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。\n\n【任務目標】\n請分析我上傳的 PDF 檔案（由線上課程截圖組成），執行 OCR 文字辨識並進行深度萃取。請針對每一組邏輯相關的內容，自動判斷最適合的整理格式：\n\n觀念/理論型內容：使用「黃金圈法則 (Why/How/What)」解析。`
            },
            {
                id: "050",
                title: "050-線上課程",
                subcategory: "筆記整理",
                category: "筆記",
                mode: "AI 助理",
                tools: ["ChatGPT", "Gemini AI"],
                content: `【角色設定】\n你是一位專精於「學習科學」與「知識管理」的 AI 助教。擅長將混亂的課程投影影片（截圖 PDF）轉化為具備邏輯、易於日後複習的高價值筆記。\n\n【任務目標】\n請分析我上傳的 PDF 檔案（由線上課程截圖組成），進行文字辨識與整理。請針對內容，自動判斷最適合的整理格式。\n並於最後一段，擷取職場可以應用的三個重點，以條列式來呈現。`
            },
            {
                id: "051",
                title: "051-長篇文章",
                subcategory: "筆記精煉",
                category: "筆記",
                mode: "AI 協做",
                tools: ["ChatGPT", "Gemini AI"],
                content: `為這篇長篇文章，進行以下四個步驟，每一個步驟都要提供給文章與標示出來\n第1、請為這篇長文生成一份體短摘要。\n第2、請基於上一個摘要，不要遺漏任何專有名詞、數字或關鍵人物，重新生成一份摘要。\n第3、現在，請將摘要中每一句話都濃縮成更簡潔的表達，同時保留所有事實，讓它讀起來更像新聞標題。\n第4、最後，請確保摘要能獨立解釋所有提到的概念，無需參照原文。\n### 長文如下：`
            },
            {
                id: "052",
                title: "052-提取練習",
                subcategory: "筆記精煉",
                category: "筆記",
                mode: "AI 協思",
                tools: ["ChatGPT", "Gemini AI", "Claude AI"],
                content: `我剛讀完了關於 [填入具體段落標題] 的內容。現在請幫我進行深度研磨：\n\n1-底層邏輯拷問：針對這段內容的「運作原理」向我提問，測試我是否理解了「為什麼有效」，而非只是記住步驟。\n\n2-隱喻轉化：如果這段概念有複雜的故事，請幫我將其轉化為一個 50 字以內的「關鍵隱喻」或「原則案例」。\n\n3-邏輯連動：這段內容與附件中之前的 [填入章...`
            }
        ];

        // Filter categories definitions
        const categories = ["全部", "寫作", "心圖", "示範", "校正", "秘訣", "程式", "筆記", "貼文", "整理", "簡報"];
        const modes = ["全部", "AI 助理", "AI 協做", "AI 協思"];
        const aiTools = ["全部", "ChatGPT", "Gemini Canvas", "NotebookLM", "Gemini AI", "Claude AI"];

        // Application State
        let rawPromptsData = [];
        let activeCategory = "全部";
        let activeMode = "全部";
        let activeTool = "全部";
        let searchQuery = "";
        let currentActivePromptForModal = null;
        let toastTimeout = null;

        // Google Sheet JSON Fetcher
        async function fetchGoogleSheetData() {
            const sheetId = '1EFSvkPdyN57kuF3bvs7Xfsc0tcjQF1KQVsadPcoSFFg';
            const gid = '1480282197';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
                if (!jsonMatch) throw new Error('Invalid GViz response format');
                
                const data = JSON.parse(jsonMatch[1]);
                const rows = data.table.rows;
                const cols = data.table.cols.map(c => c ? (c.label || c.id) : '');

                if (rows && rows.length > 0) {
                    const parsedData = rows.map((r, index) => {
                        const rowObj = {};
                        r.c.forEach((cell, idx) => {
                            const val = cell ? (cell.v !== null ? cell.v : '') : '';
                            rowObj[`col_${idx}`] = val;
                            if (cols[idx]) rowObj[cols[idx]] = val;
                        });

                        const title = rowObj['標題'] || rowObj['名稱'] || rowObj['col_0'] || `Prompt ${index + 1}`;
                        const subcategory = rowObj['小分類'] || rowObj['子分類'] || rowObj['col_1'] || '筆記整理';
                        const category = rowObj['主軸'] || rowObj['分類'] || rowObj['col_2'] || '筆記';
                        const mode = rowObj['模式'] || rowObj['col_3'] || 'AI 助理';
                        
                        let tools = [];
                        const toolStr = String(rowObj['AI 工具'] || rowObj['工具'] || rowObj['col_4'] || 'ChatGPT,Gemini AI');
                        tools = toolStr.split(/[,，\s]+/).filter(Boolean);

                        const content = rowObj['內容'] || rowObj['Prompt'] || rowObj['提示詞'] || rowObj['col_5'] || '';

                        return {
                            id: index.toString(),
                            title: String(title),
                            subcategory: String(subcategory),
                            category: String(category),
                            mode: String(mode),
                            tools: tools.length ? tools : ["ChatGPT", "Gemini AI"],
                            content: String(content)
                        };
                    });

                    document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> 已連線至 Google Sheet`;
                    return parsedData;
                }
            } catch (err) {
                console.warn("無法取得 Google Sheet 資料，使用預設資料集:", err);
                document.getElementById('syncStatus').innerHTML = `<i class="fa-solid fa-database text-purple-500"></i> 使用預設 Prompt 資料集`;
            }
            return fallbackPrompts;
        }

        function renderFilters() {
            // Category Buttons
            document.getElementById('categoryFilters').innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-3 py-1 rounded-lg text-xs sm:text-sm border transition font-medium ${
                        activeCategory === cat 
                        ? 'bg-purple-50 border-purple-500 text-purple-700 font-semibold ring-1 ring-purple-500' 
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }">
                    ${cat}
                </button>
            `).join('');

            // Mode Buttons
            document.getElementById('modeFilters').innerHTML = modes.map(m => `
                <button onclick="setMode('${m}')" 
                    class="px-3 py-1 rounded-lg text-xs sm:text-sm border transition font-medium ${
                        activeMode === m 
                        ? 'bg-purple-50 border-purple-500 text-purple-700 font-semibold ring-1 ring-purple-500' 
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }">
                    ${m}
                </button>
            `).join('');

            // AI Tool Buttons
            document.getElementById('toolFilters').innerHTML = aiTools.map(t => `
                <button onclick="setTool('${t}')" 
                    class="px-3 py-1 rounded-lg text-xs sm:text-sm border transition font-medium ${
                        activeTool === t 
                        ? 'bg-purple-50 border-purple-500 text-purple-700 font-semibold ring-1 ring-purple-500' 
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }">
                    ${t}
                </button>
            `).join('');
        }

        function getTagStyle(tag) {
            if (tag.includes('筆記')) return 'bg-slate-100 text-purple-700 font-medium';
            if (tag.includes('助理')) return 'bg-purple-100 text-purple-700 font-medium';
            if (tag.includes('協做')) return 'bg-amber-100 text-amber-700 font-medium';
            if (tag.includes('協思')) return 'bg-emerald-100 text-emerald-700 font-medium';
            if (tag.includes('ChatGPT')) return 'bg-indigo-50 text-indigo-600 border border-indigo-100';
            if (tag.includes('Gemini')) return 'bg-purple-50 text-purple-600 border border-purple-100';
            if (tag.includes('Claude')) return 'bg-blue-50 text-blue-600 border border-blue-100';
            return 'bg-slate-100 text-slate-600';
        }

        function renderPrompts() {
            const grid = document.getElementById('promptsGrid');
            const filtered = rawPromptsData.filter(item => {
                const matchCategory = (activeCategory === "全部") || (item.category === activeCategory) || (item.subcategory === activeCategory);
                const matchMode = (activeMode === "全部") || (item.mode === activeMode);
                const matchTool = (activeTool === "全部") || item.tools.some(t => t.toLowerCase().includes(activeTool.toLowerCase()));
                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q || 
                    item.title.toLowerCase().includes(q) || 
                    item.content.toLowerCase().includes(q) || 
                    item.subcategory.toLowerCase().includes(q);

                return matchCategory && matchMode && matchTool && matchSearch;
            });

            document.getElementById('itemCount').textContent = `共 ${filtered.length} 個提示詞`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-medium">沒有找到符合條件的提示詞</p>
                        <p class="text-xs text-slate-400 mt-1">嘗試調整關鍵字或重設篩選條件</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const tags = [item.category, item.mode, ...item.tools].filter(Boolean);
                
                return `
                <div class="bg-white rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between overflow-hidden border-t-4 border-t-pink-400">
                    <div class="p-5 pb-3">
                        <!-- Top Tag Pills -->
                        <div class="flex flex-wrap gap-1.5 mb-3">
                            ${tags.map(t => `<span class="px-2.5 py-0.5 rounded-full text-xs ${getTagStyle(t)}">${escapeHtml(t)}</span>`).join('')}
                        </div>

                        <!-- Subcategory -->
                        <div class="text-xs text-slate-400 font-medium mb-1">${escapeHtml(item.subcategory)}</div>

                        <!-- Card Title -->
                        <h3 class="text-lg font-bold text-slate-900 mb-3">${escapeHtml(item.title)}</h3>

                        <!-- Content Preview -->
                        <div class="text-xs text-slate-600 leading-relaxed max-h-48 overflow-y-auto custom-scrollbar whitespace-pre-wrap pr-1">
                            ${escapeHtml(item.content)}
                        </div>
                    </div>

                    <!-- Bottom Action Buttons -->
                    <div class="px-4 py-3 bg-slate-50/50 border-t border-slate-100 flex items-center gap-2">
                        <button onclick="copyPromptText('${item.id}')" 
                            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold py-2.5 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 shadow-sm active:scale-95">
                            <i class="fa-solid fa-copy"></i>
                            <span>複製 Prompt</span>
                        </button>
                        <button onclick="openModal('${item.id}')" 
                            title="編輯與查看" 
                            class="p-2.5 bg-white hover:bg-amber-50 text-slate-600 hover:text-amber-600 border border-slate-200 hover:border-amber-300 rounded-xl transition shadow-sm active:scale-95">
                            <i class="fa-solid fa-pencil text-amber-500"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderFilters();
            renderPrompts();
        }

        function setMode(m) {
            activeMode = m;
            renderFilters();
            renderPrompts();
        }

        function setTool(t) {
            activeTool = t;
            renderFilters();
            renderPrompts();
        }

        // Clipboard Copy Utility with Fallback for Iframe Environment
        function copyToClipboard(text, customMessage) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(customMessage || 'Prompt 已成功複製到剪貼簿！');
                }).catch(() => {
                    fallbackCopyText(text, customMessage);
                });
            } else {
                fallbackCopyText(text, customMessage);
            }
        }

        function fallbackCopyText(text, customMessage) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(customMessage || 'Prompt 已成功複製到剪貼簿！');
            } catch (err) {
                showToast('複製失敗，請手動複製');
            }
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            if (!toast || !toastMessage) return;

            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function copyPromptText(id) {
            const item = rawPromptsData.find(p => p.id === id);
            if (item) {
                copyToClipboard(item.content);
            }
        }

        // Modal Handlers
        function openModal(id) {
            const item = rawPromptsData.find(p => p.id === id);
            if (!item) return;

            currentActivePromptForModal = item;
            document.getElementById('modalTitleInput').value = item.title;
            document.getElementById('modalSubcategory').textContent = `${item.category} • ${item.subcategory}`;
            document.getElementById('modalContentInput').value = item.content;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            currentActivePromptForModal = null;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            renderFilters();
            rawPromptsData = await fetchGoogleSheetData();
            renderPrompts();

            // Search Event Listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderPrompts();
            });

            // Save Modified Prompt Handler
            document.getElementById('modalSaveBtn').addEventListener('click', () => {
                if (!currentActivePromptForModal) return;

                const newTitle = document.getElementById('modalTitleInput').value.trim();
                const newContent = document.getElementById('modalContentInput').value;

                if (!newTitle) {
                    showToast('標題不能為空！');
                    return;
                }

                currentActivePromptForModal.title = newTitle;
                currentActivePromptForModal.content = newContent;

                renderPrompts();
                showToast('已成功儲存 Prompt 修改！');
                closeModal();
            });

            // Copy directly from Modal Textarea
            document.getElementById('modalCopyBtn').addEventListener('click', () => {
                const contentToCopy = document.getElementById('modalContentInput').value;
                if (contentToCopy) {
                    copyToClipboard(contentToCopy, '已複製最新內容至剪貼簿！');
                }
            });

            // Modal Close Listeners
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('detailModal')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
